# CI for the nonhuman-screen repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (bam + dev extras)
        run: pip install -e '.[bam,dev]'
      - name: Unit tests
        # kraken2-dependent integration tests self-skip when the binary is
        # absent (pytest.mark.skipif), so this lane needs no kraken2 database.
        run: pytest tests/ -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kraken2 (pinned)
        run: |
          git clone --depth 1 --branch v2.17.1 \
            https://github.com/DerrickWood/kraken2.git /tmp/kraken2
          sudo /tmp/kraken2/install_kraken2.sh /usr/local/bin
          kraken2 --version
      - name: Install (bam + dev extras)
        run: pip install -e '.[bam,dev]'
      - name: Integration tests (builds a tiny kraken2 DB)
        run: pytest tests/test_integration.py -v
      - name: Functional CLI tests (committed fixtures: strep pos/neg controls)
        run: pytest tests/test_functional_cli.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
